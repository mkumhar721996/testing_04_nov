version: 2
components:
  comp_web_app:
    name: Web App
    repo_ref: conn-github-fc7f5117421946948ff7acfbdbf4a7d8
    kind: web_ui
    directory: apps/web
    integrations:
    - to: comp_core_api
      interaction: sync
      via: http
      status: planned
      evidence: accepted architecture seam
    stack:
      choices:
        styling: Tailwind CSS
        language: JavaScript/TypeScript
        framework: React
        package_manager: pnpm
        testing_tool_e2e: Playwright
        testing_tool_unit: vitest
      notes: database not applicable — calls Core API only
  comp_core_api:
    name: Core API
    repo_ref: conn-github-fc7f5117421946948ff7acfbdbf4a7d8
    kind: api_service
    directory: services/api
    integrations:
    - to: comp_relational_database
      interaction: sync
      via: postgresql
      status: planned
      evidence: accepted architecture seam
    - to: comp_authentication_service
      interaction: sync
      via: http
      status: planned
      evidence: accepted architecture seam; STORY-048
    - to: comp_email_service
      interaction: async
      status: planned
      evidence: accepted architecture seam
    - to: comp_sap_integration_service
      interaction: sync
      via: http
      status: planned
      evidence: 'EPIC-013, 014, 015: search, placeOrder, getOrders call the SAP service''s
        internal endpoints'
    - to: comp_object_storage
      interaction: sync
      via: https
      status: planned
      evidence: recommended default, accepted by the human without review; STORY-017
    - to: external:stripe-api
      interaction: sync
      status: planned
      evidence: recommended default, accepted by the human without review; EPIC-024
    stack:
      choices:
        database: PostgreSQL
        language: JavaScript/TypeScript
        framework: NestJS
        package_manager: pnpm
        testing_tool_e2e: Playwright
        testing_tool_unit: vitest
      notes: styling not applicable — API only; e2e via Playwright API testing
  comp_relational_database:
    name: Relational Database
    repo_ref: conn-github-fc7f5117421946948ff7acfbdbf4a7d8
    kind: infrastructure
    stack:
      choices:
        managed_service: PostgreSQL
      notes: named by the architecture; single tenant, cross-region replica
  comp_background_worker:
    name: Background Worker
    repo_ref: conn-github-fc7f5117421946948ff7acfbdbf4a7d8
    kind: worker
    directory: services/worker
    integrations:
    - to: comp_relational_database
      interaction: shared-storage
      via: postgresql
      status: planned
      evidence: accepted architecture seam
    - to: comp_email_service
      interaction: async
      status: planned
      evidence: accepted architecture seam
    - to: comp_core_api
      interaction: sync
      via: http
      status: planned
      evidence: accepted architecture seam
    - to: comp_sap_integration_service
      interaction: sync
      via: http
      status: planned
      evidence: 'EPIC-014: failed child orders are retried through the SAP integration'
    stack:
      choices:
        language: JavaScript/TypeScript
        package_manager: pnpm
        testing_tool_unit: vitest
      notes: uses the shared PostgreSQL database but does not own it; no UI or externally
        called surface, so no e2e
  comp_authentication_service:
    name: Authentication Service
    repo_ref: conn-github-fc7f5117421946948ff7acfbdbf4a7d8
    kind: managed_service
    integrations:
    - to: external:microsoft-entra-id
      interaction: sync
      status: planned
      evidence: accepted architecture; EPIC-005
    identity:
      provider: entra
      hosting: managed
      protocols:
      - oidc
      - oauth2
      - jwt
      token: jwt
      user_store: provider
    stack:
      choices:
        managed_service: Microsoft Entra ID
      notes: named by the architecture; Core API validates its tokens
  comp_email_service:
    name: Email Service
    repo_ref: conn-github-fc7f5117421946948ff7acfbdbf4a7d8
    kind: managed_service
    integrations:
    - to: external:email-providers
      interaction: sync
      status: planned
      evidence: 'accepted architecture: Microsoft Graph primary, SendGrid fallback'
    stack:
      choices:
        managed_service: Microsoft 365 (Microsoft Graph Mail API), SendGrid as fallback
      notes: named by the architecture
  comp_sap_integration_service:
    name: SAP Integration Service
    repo_ref: conn-github-fc7f5117421946948ff7acfbdbf4a7d8
    kind: api_service
    directory: services/sap-integration
    integrations:
    - to: external:sap
      interaction: sync
      status: planned
      evidence: 'EPIC-011, EPIC-012: three existing SAP instances via ABAP RFC/BAPIs
        over JCo'
    stack:
      choices:
        language: java
        framework: spring-boot
        package_manager: maven
        testing_tool_e2e: spring-boot-test-wiremock
        testing_tool_unit: junit-5
      notes: database not applicable — retry queue lives in the Core API's PostgreSQL;
        styling not applicable — no UI
  comp_object_storage:
    name: Object Storage
    repo_ref: conn-github-fc7f5117421946948ff7acfbdbf4a7d8
    kind: managed_service
    stack:
      choices:
        managed_service: Amazon S3
