<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App shell</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="prototype-utils.css">
  <style>
    .shell { min-height: 100vh; display: flex; flex-direction: column; max-width: 100%; }
    .shell-header {
      position: sticky; top: 0; z-index: var(--z-shell-header);
      display: flex; align-items: center; gap: var(--space-2);
      min-height: var(--shell-header-height); padding: 0 var(--space-3);
      background: var(--color-surface); border-bottom: var(--border-width) solid var(--color-border);
    }
    .shell-brand { font-weight: var(--font-weight-bold); font-size: var(--font-size-lg); color: var(--color-fg); text-decoration: none; margin-right: auto; }
    .shell-header .btn, .shell-brand, .shell-footer a {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: var(--touch-target-min, 44px); min-width: var(--touch-target-min, 44px);
      box-sizing: border-box;
    }
    .shell-header .shell-brand, .shell-footer a { padding: 0 var(--space-2, 8px); }
    .shell-body { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .shell-nav { display: none; padding: var(--space-2); background: var(--color-bg-subtle); border-bottom: var(--border-width) solid var(--color-border); }
    .shell-nav.is-open { display: block; }
    .shell-nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-1); }
    .shell-nav a {
      display: block; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
      color: var(--color-fg); text-decoration: none; font-weight: var(--font-weight-medium);
    }
    .shell-nav a:hover { background: var(--color-surface); }
    .shell-nav a[aria-current="page"] { background: var(--color-primary); color: var(--color-on-primary); }
    .shell-content { flex: 1; min-width: 0; width: 100%; max-width: var(--content-max-width); margin: 0 auto; padding: var(--space-3); }
    .shell-footer {
      display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-3); justify-content: space-between;
      padding: var(--space-3); border-top: var(--border-width) solid var(--color-border);
      color: var(--color-fg-muted); font-size: var(--font-size-sm);
    }
    .shell-footer ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .shell-nav a { min-height: var(--touch-target-min, 44px); display: flex; align-items: center; }
    @media (min-width: 768px) {
      .shell-header .shell-menu-btn { display: none; }
      .shell-body { flex-direction: row; }
      .shell-nav, .shell-nav.is-open {
        display: block; flex: none; width: var(--sidebar-width); padding: var(--space-3);
        border-bottom: 0; border-right: var(--border-width) solid var(--color-border);
      }
      .shell-content { padding: var(--space-4); }
    }
  </style>
</head>
<body>
  <div class="shell" data-arc-shell>
    <header class="shell-header" data-arc-shell-part="header">
      <button class="btn btn-ghost btn-icon shell-menu-btn" type="button" data-toggle="shell-nav" aria-controls="shell-nav" aria-label="Menu">&#9776;</button>
      <a class="shell-brand" href="#">Workspace</a>
      <a class="btn btn-ghost btn-sm" href="#" data-nav-key="account">Account</a>
    </header>
    <div class="shell-body">
      <nav class="shell-nav" id="shell-nav" aria-label="Main" data-arc-shell-part="nav">
        <ul>
          <li><a href="#" data-nav-key="dashboard">Dashboard</a></li>
          <li><a href="#" data-nav-key="items">Items</a></li>
          <li><a href="#" data-nav-key="activity">Activity</a></li>
          <li><a href="#" data-nav-key="settings">Settings</a></li>
        </ul>
      </nav>
      <main class="shell-content" data-arc-content></main>
    </div>
    <footer class="shell-footer" data-arc-shell-part="footer">
      <span>&copy; Workspace</span>
      <ul>
        <li><a href="#">Help</a></li>
        <li><a href="#">Privacy</a></li>
      </ul>
    </footer>
  </div>
</body>
</html>
